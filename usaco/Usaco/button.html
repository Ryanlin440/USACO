<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Toggle Control</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* The fused container wrapper */
        .toggle-container {
            display: flex;
            background: #e9ecef;
            padding: 6px;
            border-radius: 30px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
            gap: 4px;
        }

        /* Base button design */
        .toggle-btn {
            border: none;
            outline: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 24px;
            cursor: pointer;
            color: #6c757d;
            background: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Active Green State */
        .toggle-btn.active-green {
            background: #28a745;
            color: white;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        /* Active Red State */
        .toggle-btn.active-red {
            background: #dc3545;
            color: white;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
        }

        /* Micro-interaction: Hovering unselected button */
        .toggle-btn:not(.active-green):not(.active-red):hover {
            background: rgba(0, 0, 0, 0.04);
            color: #495057;
        }
    </style>
</head>
<body>

    <div class="toggle-container">
        <button id="btnWrong" class="toggle-btn" onclick="selectOption('wrong')">
            ✕ Wrong
        </button>
        <button id="btnRight" class="toggle-btn" onclick="selectOption('right')">
            ✓ Right
        </button>
    </div>

    <script>
        function selectOption(choice) {
            const wrongBtn = document.getElementById('btnWrong');
            const rightBtn = document.getElementById('btnRight');

            if (choice === 'right') {
                rightBtn.className = 'toggle-btn active-green';
                wrongBtn.className = 'toggle-btn'; // Resets wrong to neutral
            } else {
                wrongBtn.className = 'toggle-btn active-red';
                rightBtn.className = 'toggle-btn'; // Resets right to neutral
            }
        }
    </script>
</body>
</html>
